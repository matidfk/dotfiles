source = ~/.config/hypr/theme.conf


monitor = DP-3, 1920x1080@74.97, 0x0, 1
monitor = HDMI-A-2, 1920x1080@60, 1920x0, 1

$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

exec-once = waybar
# exec-once = hyprpaper
exec-once = sleep 1; "$HOME/.config/hypr/scripts/random_wallpaper.sh"


exec-once = udiskie # automatic usb mount
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store 

exec-once = hyprctl dispatch exec "[workspace 2 silent] zen-browser"
exec-once = hyprctl dispatch exec "[workspace 6 silent] discord"
exec-once = hyprctl dispatch exec "[workspace special:magic silent; float; size 1280 720] kitty"

exec-once = hyprpm enable hyprbars


env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = XDG_MENU_PREFIX=arch-

general {
    layout = dwindle
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2
}

master {
    new_status = master
    new_on_top = 1
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    numlock_by_default = 1
    repeat_rate = 40
    repeat_delay = 250

    follow_mouse = 2
    accel_profile = flat

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

cursor {
    no_warps = true
}

gesture = 3, horizontal, workspace

bind = SUPER, Q, exec, $terminal
bind = SUPER, W, killactive,
# bind = SUPER, M, exit,
bind = SUPER, E, exec, $fileManager
bind = SUPER, F, fullscreen
bind = SUPER, S, togglefloating,
bind = SUPER, SPACE, exec, $menu
bind = SUPER, P, pseudo, # dwindle
# bind = SUPER, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# move windows
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# resize windows
bind = SUPER CTRL, H, resizeactive, -40 0
bind = SUPER CTRL, L, resizeactive, 40 0
bind = SUPER CTRL, K, resizeactive, 0 -40
bind = SUPER CTRL, J, resizeactive, 0 40

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = SUPER, RETURN, togglespecialworkspace, magic
bind = SUPER SHIFT, RETURN, movetoworkspacesilent, special:magic

bind = SUPER, V, exec, cliphist list | wofi -dmenu -display-columns 2 | cliphist decode | wl-copy
bind = SUPER SHIFT, S, exec, hyprshot -m region -o $HOME/Screenshots/ | satty --filename -

bind = SUPER CTRL, T, exec, sh $HOME/Scripts/theme-selector.sh
bind = SUPER CTRL, W, exec, sh $HOME/.config/hypr/scripts/random_wallpaper.sh

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

workspace = 1, monitor:DP-3
workspace = 2, monitor:DP-3
workspace = 3, monitor:DP-3
workspace = 4, monitor:DP-3
workspace = 5, monitor:DP-3
workspace = 6, monitor:HDMI-A-2
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2
workspace = 9, monitor:HDMI-A-2
workspace = 10, monitor:HDMI-A-2

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Floating by default for picture in picture video
windowrule {
    name = floating-pip
    match:title = (Picture-in-Picture)
    float = yes
}

# Show title bars only on floating windows
windowrule {
    name = floating-only-bars
    match:float = 0
    hyprbars:no_bar = true
}

## color ssh windows
windowrule {
    name = color-ssh-windows
    match:title = .*ssh.*
    border_color = rgba(ff4800ee) rgba(ff33b8ee) 45deg
    hyprbars:bar_color = rgb(ff4800)
}

# gapless with only 1 window
workspace = w[t1], gapsout:0, gapsin:0
windowrule {
    name = single-window-gapless
    match:workspace = w[t1]
    rounding = 0
}
